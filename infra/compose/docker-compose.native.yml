# Vykronis — GHCR binary demo overlay.
#
# Swaps the four core services' local JVM images for the binaries published to
# GHCR by the `native` workflow (public, anonymous pull). NOTE (2026-09-12):
# the currently-published `:native` tags are still JVM images (native build
# misconfigured - now fixed, re-dispatch pending); once re-published they will
# be true GraalVM binaries. The rest of the stack (Postgres / Kafka / Redis and
# the other four JVM apps) runs exactly as in the daily compose loop.
#
# Usage (from the repo root):
#   docker compose -f infra/compose/docker-compose.yml \
#                 -f infra/compose/docker-compose.apps.yml \
#                 -f infra/compose/docker-compose.native.yml \
#                 --profile apps up -d
#   docker stats   # watch the four containers' memory
name: vykronis

services:
  api-gateway:
    image: ghcr.io/sreelekha-22/vykronis/api-gateway:native
    build: null
    # OTLP exporters use protobuf reflection with no GraalVM metadata yet, so
    # native binaries disable them (JVM images in apps.yml keep full OTLP).
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"

  event-service:
    image: ghcr.io/sreelekha-22/vykronis/event-service:native
    build: null
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"

  agent-orchestrator:
    image: ghcr.io/sreelekha-22/vykronis/agent-orchestrator:native
    build: null
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"

  policy-service:
    image: ghcr.io/sreelekha-22/vykronis/policy-service:native
    build: null
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"