# Vykronis — GHCR binary demo overlay.
#
# Swaps the four core services' local JVM images for the true GraalVM native
# binaries published to GHCR by the `native` workflow (public, anonymous pull,
# dispatch 34709798539 / 32ea577 - all four green). Real measured footprint:
# policy 177 MB/0.088 s/~55 MiB, api-gateway 202 MB/0.163 s/~73 MiB,
# event 300 MB/1.258 s/~103 MiB, agent 310 MB/0.172 s/~88 MiB (details in
# docs/NATIVE.md "Measured numbers"). The rest of the stack (Postgres / Kafka /
# Redis and the other four JVM apps) runs exactly as in the daily compose loop.
#
# Usage (from the repo root):
#   docker compose -f infra/compose/docker-compose.yml \
#                 -f infra/compose/docker-compose.apps.yml \
#                 -f infra/compose/docker-compose.native.yml \
#                 --profile apps up -d
#   docker stats   # watch the four containers' memory
name: vykronis

services:
  api-gateway:
    image: ghcr.io/sreelekha-22/vykronis/api-gateway:native
    build: null
    # OTLP exporters need protobuf reflection; the ExtensionRegistry hints are
    # registered, so these disables are only defensive noise reduction
    # (JVM images in apps.yml keep full OTLP).
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"

  event-service:
    image: ghcr.io/sreelekha-22/vykronis/event-service:native
    build: null
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"

  agent-orchestrator:
    image: ghcr.io/sreelekha-22/vykronis/agent-orchestrator:native
    build: null
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"

  policy-service:
    image: ghcr.io/sreelekha-22/vykronis/policy-service:native
    build: null
    environment:
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "false"