# Vykronis Prometheus config (Phase 3 observability profile).
# Scrapes the OTel Collector (receives OTLP metrics/traces from the platform
# services) and the platform services' actuator /actuator/prometheus metrics
# endpoints (wired via common-observability, Phase 3 unit 2).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "vykronis-services"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "api-gateway:8080"
          - "ingestion-service:8081"
          - "event-service:8082"
          - "correlation-engine:8083"
          - "incident-service:8084"
          - "agent-orchestrator:8085"
          - "policy-service:8086"
          - "remediation-service:8087"
