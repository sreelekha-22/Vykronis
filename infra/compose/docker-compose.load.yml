# Vykronis — k6 demo traffic generator (overlay for the app services stack).
#
# Usage (from the repo root) — requires the core + apps stacks first:
#   docker compose -f infra/compose/docker-compose.yml \
#                 -f infra/compose/docker-compose.apps.yml \
#                 -f infra/compose/docker-compose.load.yml up -d --build
#   docker compose -f infra/compose/docker-compose.yml \
#                 -f infra/compose/docker-compose.apps.yml \
#                 -f infra/compose/docker-compose.load.yml \
#                 --profile apps --profile load up k6
#
# The k6 container reads its thresholds; watch the incident appear via the UI
# (kubectl port-forward svc/api-gateway 8080:80) or the postgres remediation_learn.
name: vykronis

services:
  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    depends_on:
      - ingestion-service
      - agent-orchestrator
    volumes:
      - ../../tools/k6:/scripts:ro
    environment:
      INGEST_URL: http://ingestion-service:8081
      ORCH_URL: http://agent-orchestrator:8085
    command: run /scripts/load.js