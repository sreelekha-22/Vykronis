# Vykronis — Docker Compose (local daily loop)
#
# Profiles (docker compose --profile <name> up -d):
#   core (default) : Kafka KRaft, Postgres, Redis
#   observability  : Prometheus, Grafana, OTel Collector   (Phase 3)
#   search         : OpenSearch                            (Phase 3)
#   ai             : Ollama                                (Phase 4)
#   auth           : Keycloak                              (Phase 5)
#
# Lite daily run:  docker compose -f infra/compose/docker-compose.yml up -d
name: vykronis

services:
  # ---- core ---------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.2
    container_name: vykronis-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: vykronis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vykronis
      POSTGRES_PASSWORD: vykronis
      POSTGRES_DB: vykronis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vykronis -d vykronis"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: vykronis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- observability (Phase 3) -------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    container_name: vykronis-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus-format /metrics
      - "8889:8889"   # collector internal telemetry
    depends_on:
      - kafka

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: vykronis-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.1.0
    container_name: vykronis-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: vykronis
      GF_SECURITY_ADMIN_PASSWORD: vykronis
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---- search (Phase 3) --------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: vykronis-opensearch
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"   # REST
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---- auth (Phase 5) ----------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: vykronis-keycloak
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: vykronis-dev
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/vykronis
      KC_DB_USERNAME: vykronis
      KC_DB_PASSWORD: vykronis
    volumes:
      - ./keycloak/vykronis-realm.json:/opt/keycloak/data/import/vykronis-realm.json:ro
    ports:
      - "8088:8080"   # Admin console + realm endpoints (container default 8080)
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8088 && echo -e 'GET /realms/vykronis HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -c 200 <&3 | grep -q '200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ---- ai (Phase 4, optional local LLM) -----------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: vykronis-ollama
    profiles: ["ai"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"   # Ollama REST API
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  grafana-data:
  opensearch-data:
  ollama-data:
