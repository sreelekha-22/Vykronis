{{/* One Deployment per platform service: probes + resources are mandatory. */}}
{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "vykronis.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vykronis.selectorLabels" (dict "Chart" $.Chart "Release" $.Release "service" .name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vykronis.selectorLabels" (dict "Chart" $.Chart "Release" $.Release "service" .name) | nindent 8 }}
    spec:
      {{- if .topicsInit }}
      initContainers:
        - name: kafka-topics-init
          image: {{ $.Values.kafka.image | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              BOOTSTRAP={{ $.Values.vykronis.kafka.bootstrap | quote }}
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list >/dev/null 2>&1; do sleep 2; done
              for t in obs.metrics:3 obs.deployments:3 obs.alerts:3 obs.remediation:1 obs.jfr:1; do
                name=${t%%:*}; parts=${t##*:}
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" \
                  --create --if-not-exists --topic "$name" --partitions "$parts" --replication-factor 1 || true
              done
      {{- end }}
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.repository }}/{{ .name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .port }}
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ $.Values.vykronis.java.opts | quote }}
            - name: VYKRONIS_REMEDIATION_TARGET
              value: {{ $.Values.vykronis.remediation.target | quote }}
            - name: VYKRONIS_KAFKA_BOOTSTRAP
              value: {{ $.Values.vykronis.kafka.bootstrap | quote }}
            - name: VYKRONIS_DB_URL
              value: {{ $.Values.vykronis.db.url | quote }}
            - name: VYKRONIS_DB_USER
              value: {{ $.Values.vykronis.db.username | quote }}
            - name: VYKRONIS_DB_PASSWORD
              value: {{ $.Values.vykronis.db.password | quote }}
            - name: SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
              value: "60000"
          startupProbe:
            httpGet:
              path: {{ $.Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: {{ $.Values.probes.startupFailureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $.Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ $.Values.probes.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $.Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: {{ $.Values.probes.readinessInitialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.periodSeconds }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
