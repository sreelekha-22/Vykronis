{{/* Kafka (KRaft, single broker) as a Deployment for the demo cluster. */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    {{- include "vykronis.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vykronis.selectorLabels" (dict "Chart" .Chart "Release" .Release "service" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vykronis.selectorLabels" (dict "Chart" .Chart "Release" .Release "service" "kafka") | nindent 8 }}
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image | quote }}
          ports:
            - name: kafka
              containerPort: {{ .Values.kafka.port }}
              protocol: TCP
            - name: controller
              containerPort: {{ .Values.kafka.controllerPort }}
              protocol: TCP
          env:
            - name: CLUSTER_ID
              value: vykronis-demo-cluster-id-0001
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.kafka.heapOpts | quote }}
          startupProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "vykronis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vykronis.selectorLabels" (dict "Chart" .Chart "Release" .Release "service" "kafka") | nindent 4 }}
  ports:
    - name: kafka
      port: {{ .Values.kafka.port }}
      targetPort: kafka
      protocol: TCP
    - name: controller
      port: {{ .Values.kafka.controllerPort }}
      targetPort: controller
      protocol: TCP
