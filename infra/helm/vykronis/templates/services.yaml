{{/* ClusterIP Service per platform service. */}}
{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "vykronis.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vykronis.selectorLabels" (dict "Chart" $.Chart "Release" $.Release "service" .name) | nindent 4 }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
      protocol: TCP
{{- end }}
