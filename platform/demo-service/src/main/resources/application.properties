spring.application.name=demo-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/vykronis
spring.datasource.username=vykronis
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

flyway.url=jdbc:postgresql://localhost:5432/vykronis
flyway.user=vykronis
flyway.password=secret
flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,beans
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=demo-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer