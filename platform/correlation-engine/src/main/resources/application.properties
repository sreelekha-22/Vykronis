spring.application.name=correlation-engine
server.port=8083

kafka.bootstrap-servers=${VYKRONIS_KAFKA_BOOTSTRAP:localhost:9092}

# Correlation windowing / threshold tuning (local demo defaults)
correlation.window.minutes=1
correlation.window.grace.seconds=5
correlation.error-rate-threshold=20.0
correlation.error-count-threshold=5

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
