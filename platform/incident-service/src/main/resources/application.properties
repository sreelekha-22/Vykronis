spring.application.name=incident-service
server.port=8084

# Phase 4 Unit 6: where to POST investigations (the agent orchestrator).
vykronis.orchestrator.url=${VYKRONIS_ORCHESTRATOR_URL:http://localhost:8085}

# Phase 5 Unit 4: where to POST policy evaluations (the policy service).
vykronis.policy.url=${VYKRONIS_POLICY_URL:http://localhost:8086}

kafka.bootstrap-servers=${VYKRONIS_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=incident-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.datasource.url=${VYKRONIS_DB_URL:jdbc:postgresql://localhost:5432/vykronis}
spring.datasource.username=${VYKRONIS_DB_USER:vykronis}
spring.datasource.password=${VYKRONIS_DB_PASSWORD:vykronis}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

flyway.url=${VYKRONIS_DB_URL:jdbc:postgresql://localhost:5432/vykronis}
flyway.user=${VYKRONIS_DB_USER:vykronis}
flyway.password=${VYKRONIS_DB_PASSWORD:vykronis}
flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true