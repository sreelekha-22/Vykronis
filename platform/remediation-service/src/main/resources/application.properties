spring.application.name=remediation-service
server.port=8087

# Idempotency store target: the same Postgres used by the platform.
spring.datasource.url=${VYKRONIS_DB_URL:jdbc:postgresql://localhost:5432/vykronis}
spring.datasource.username=${VYKRONIS_DB_USER:vykronis}
spring.datasource.password=${VYKRONIS_DB_PASSWORD:vykronis}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

flyway.url=${VYKRONIS_DB_URL:jdbc:postgresql://localhost:5432/vykronis}
flyway.user=${VYKRONIS_DB_USER:vykronis}
flyway.password=${VYKRONIS_DB_PASSWORD:vykronis}
flyway.locations=classpath:db/migration

# Remediation transport on obs.remediation.
kafka.bootstrap-servers=${VYKRONIS_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=remediation-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Docker Compose target (base file + apps overlay). The only place Vykronis
# talks to docker. When running the service on Compose, the docker CLI is
# provided by mounting the host socket into the remediation container.
remediation.compose.files=${VYKRONIS_COMPOSE_FILES:infra/compose/docker-compose.yml,infra/compose/docker-compose.apps.yml}
remediation.docker.timeout-seconds=${VYKRONIS_DOCKER_TIMEOUT:120}

# Deployment target - "compose" (default) hands the remediation command to the
# ComposeExecutor (host docker socket); "kubernetes" hands it to the
# KubernetesExecutor (kubectl rollout). Phase 7 Unit 2 wires both up; the
# Kind/Helm chart flips this on install.
vykronis.remediation.target=${VYKRONIS_REMEDIATION_TARGET:compose}
# Kubernetes target only (ignored when target=compose).
vykronis.remediation.kubernetes.namespace=${VYKRONIS_K8S_NAMESPACE:vykronis}
vykronis.remediation.kubernetes.kubectl-binary=${VYKRONIS_KUBECTL_BINARY:kubectl}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true