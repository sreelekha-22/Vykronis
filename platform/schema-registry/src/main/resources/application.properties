spring.application.name=schema-registry
server.port=8090

# Seed the registry from the bundled contract schemas at startup.
# Key = file stem in classpath:contracts/schema/, value = governing Kafka topic.
vykronis.schema-registry.bootstrap.observability-event=obs.metrics
vykronis.schema-registry.bootstrap.deployment-event=obs.deployments
vykronis.schema-registry.bootstrap.incident-candidate=obs.alerts
vykronis.schema-registry.bootstrap.remediation-event=obs.remediation
vykronis.schema-registry.bootstrap.jfr-record=obs.jfr

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true