spring.application.name=agent-orchestrator
server.port=8085

vykronis.ai.provider=none

# Allow-listed HTTP endpoints agent tools may talk to (Phase 4 Unit 2).
# Deny-by-default: every service the agent may reach must be declared here.
# Local defaults point at directly-launched services; compose/kubernetes
# override via VYKRONIS_INCIDENT_URL / VYKRONIS_EVENT_URL.
vykronis.agent.tools.incident-url=${VYKRONIS_INCIDENT_URL:http://localhost:8084}
vykronis.agent.tools.incident-allowlist=/api/incidents
vykronis.agent.tools.event-url=${VYKRONIS_EVENT_URL:http://localhost:8082}
vykronis.agent.tools.event-allowlist=/api/search

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true