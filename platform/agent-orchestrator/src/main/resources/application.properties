spring.application.name=agent-orchestrator
server.port=8085

# Phase 4 Unit 4 — config-only provider selection. Only the provider named here
# is built at startup; a missing key or absent Ollama never breaks the context.
# none (default) keeps the platform fully functional without any LLM.
vykronis.ai.provider=${VYKRONIS_AI_PROVIDER:none}
vykronis.ai.api-key=${VYKRONIS_AI_API_KEY:}
vykronis.ai.ollama.base-url=${VYKRONIS_OLLAMA_URL:http://localhost:11434}
vykronis.ai.ollama.model=${VYKRONIS_OLLAMA_MODEL:llama3.2}
vykronis.ai.groq.base-url=https://api.groq.com/openai/v1
vykronis.ai.groq.model=llama-3.3-70b-versatile
vykronis.ai.huggingface.base-url=https://api-inference.huggingface.co/v1
vykronis.ai.huggingface.model=meta-llama/llama-3.3-70b-instruct:free
vykronis.ai.openrouter.base-url=https://openrouter.ai/api/v1
vykronis.ai.openrouter.model=meta-llama/llama-3.3-70b-instruct:free
vykronis.ai.gemini.model=gemini-2.5-flash

# Allow-listed HTTP endpoints agent tools may talk to (Phase 4 Unit 2).
# Deny-by-default: every service the agent may reach must be declared here.
# Local defaults point at directly-launched services; compose/kubernetes
# override via VYKRONIS_INCIDENT_URL / VYKRONIS_EVENT_URL.
vykronis.agent.tools.incident-url=${VYKRONIS_INCIDENT_URL:http://localhost:8084}
vykronis.agent.tools.incident-allowlist=/api/incidents
vykronis.agent.tools.event-url=${VYKRONIS_EVENT_URL:http://localhost:8082}
vykronis.agent.tools.event-allowlist=/api/search

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true