spring.application.name=event-service
server.port=8082

spring.datasource.url=${VYKRONIS_DB_URL:jdbc:postgresql://localhost:5432/vykronis}
spring.datasource.username=${VYKRONIS_DB_USER:vykronis}
spring.datasource.password=${VYKRONIS_DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

flyway.url=${VYKRONIS_DB_URL:jdbc:postgresql://localhost:5432/vykronis}
flyway.user=${VYKRONIS_DB_USER:vykronis}
flyway.password=${VYKRONIS_DB_PASSWORD:secret}
flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${VYKRONIS_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=event-service
spring.kafka.consumer.auto-offset-reset=earliest

vykronis.search.url=${VYKRONIS_OPENSEARCH_URL:http://localhost:9200}
vykronis.search.index=obs-events

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true