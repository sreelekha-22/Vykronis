spring.application.name=event-service
server.port=8082

spring.datasource.url=${VYKRONIS_DB_URL:jdbc:postgresql://localhost:5432/vykronis}
spring.datasource.username=${VYKRONIS_DB_USER:vykronis}
spring.datasource.password=${VYKRONIS_DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

flyway.url=${VYKRONIS_DB_URL:jdbc:postgresql://localhost:5432/vykronis}
flyway.user=${VYKRONIS_DB_USER:vykronis}
flyway.password=${VYKRONIS_DB_PASSWORD:secret}
flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true