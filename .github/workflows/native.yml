name: native

on:
  workflow_dispatch:

jobs:
  native:
    name: Native (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: policy-service
            appclass: PolicyServiceApplication
          - service: api-gateway
            appclass: ApiGatewayApplication
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Package reactor (+ ${{ matrix.service }} jar + local repo install)
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -pl platform/${{ matrix.service }} -am install -DskipTests

      - name: Native image via Spring Boot buildpack
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -pl platform/${{ matrix.service }} spring-boot:build-image \
            -Dspring-boot.build-image.imageName=vykronis/${{ matrix.service }}:native \
            -Dspring-boot.build-image.nativeImage=true \
            -DskipTests

      - name: Publish to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag vykronis/${{ matrix.service }}:native \
            ghcr.io/${{ github.repository_owner }}/vykronis/${{ matrix.service }}:native
          docker push ghcr.io/${{ github.repository_owner }}/vykronis/${{ matrix.service }}:native

      - name: Smoke + measure the native image (health UP, size, boot, RSS)
        run: |
          NAME=${{ matrix.service }}-native-smoke
          docker run -d --name "$NAME" \
            -e SERVER_PORT=8085 -e MANAGEMENT_SERVER_PORT=8081 \
            -p 18085:8085 -p 18081:8081 \
            vykronis/${{ matrix.service }}:native
          ok=0
          for i in $(seq 1 90); do
            sleep 2
            h1=$(curl -fsS http://localhost:18081/actuator/health 2>/dev/null || true)
            h2=$(curl -fsS http://localhost:18085/actuator/health 2>/dev/null || true)
            if echo "$h1$h2" | grep -q '"status":"UP"'; then
              ok=1
              break
            fi
            docker logs "$NAME" 2>/dev/null | tail -3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::native smoke failed for ${{ matrix.service }}"
            docker logs "$NAME"
            docker rm -f "$NAME"
            exit 1
          fi
          BOOT=$(docker logs "$NAME" 2>/dev/null | grep -oE "Started ${{ matrix.appclass }} in [0-9.]+ seconds" | tail -1)
          SIZE=$(docker image inspect vykronis/${{ matrix.service }}:native --format '{{.Size}}' | numfmt --to=iec)
          RSS=$(docker exec "$NAME" sh -c 'grep VmRSS /proc/1/status' 2>/dev/null | awk '{print $2 " kB"}')
          RSS=${RSS:-n/a}
          {
            echo "### ${{ matrix.service }} (native)"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| image size | $SIZE |"
            echo "| boot time | $BOOT |"
            echo "| container RSS (approx) | $RSS |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat > native-report.txt <<EOF
          service: ${{ matrix.service }}
          image: vykronis/${{ matrix.service }}:$SIZE
          boot: $BOOT
          rss: $RSS
          EOF
          echo "--- native report (${{ matrix.service }}) ---"
          cat native-report.txt
          docker rm -f "$NAME"

      - name: Upload native report
        uses: actions/upload-artifact@v4
        with:
          name: native-report-${{ matrix.service }}
          path: native-report.txt
          retention-days: 30