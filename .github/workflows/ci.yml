name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-kind-smoke:
        description: 'Build images and run the live kind smoke (-Dhelm.smoke.kind=true)'
        type: boolean
        default: false

jobs:
  build-test:
    name: Build & Test (Java ${{ matrix.java }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [25]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & Test (full reactor + JaCoCo gate)
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Upload JaCoCo Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports-${{ matrix.os }}
          path: |
            **/target/site/jacoco/
          retention-days: 7

  ui:
    name: UI (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Unit Tests (with coverage)
        run: npx vitest run --coverage

      - name: Build (next)
        run: npm run build

      - name: Upload UI Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: ui/web/coverage/
          retention-days: 7

  kind-smoke:
    name: Kind smoke (chart install, pods Ready)
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-kind-smoke == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Install helm, kind, kubeconform, kubectl
        run: |
          set -eux
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          KIND="$(curl -fsSL https://api.github.com/repos/kubernetes-sigs/kind/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')"
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/v${KIND}/kind-linux-amd64"
          sudo install kind /usr/local/bin/kind
          rm kind
          KC="$(curl -fsSL https://api.github.com/repos/yannh/kubeconform/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')"
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KC}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          rm kubeconform.tar.gz
          KUBE="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBE}/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          rm kubectl

      - name: Build runtime + service images (vykronis/<service>:local)
        run: |
          docker build -f infra/docker/runtime.Dockerfile -t vykronis/runtime:local .
          docker compose -f infra/compose/docker-compose.apps.yml build

      - name: Kind smoke (-Dhelm.smoke.kind=true)
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -pl libs/common test -Dhelm.smoke.kind=true

      - name: Upload kind logs
        if: failure()
        run: |
          kind export logs --name vykronis-smoke kind-logs || true
          true

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-smoke-logs
          path: kind-logs
          retention-days: 7

  notify:
    name: Status Summary
    needs: [build-test, ui]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summarize
        run: |
          echo "Build matrix: ${{ needs.build-test.result }}"
          echo "UI: ${{ needs.ui.result }}"
          if [[ "${{ needs.build-test.result }}" != "success" || "${{ needs.ui.result }}" != "success" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi