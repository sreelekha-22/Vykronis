name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (Java ${{ matrix.java }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [25]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & Test (full reactor + JaCoCo gate)
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Upload JaCoCo Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-reports-${{ matrix.os }}
          path: |
            **/target/site/jacoco/
          retention-days: 7

  ui:
    name: UI (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Unit Tests (with coverage)
        run: npx vitest run --coverage

      - name: Build (next)
        run: npm run build

      - name: Upload UI Coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-coverage
          path: ui/web/coverage/
          retention-days: 7

  extensions:
    name: Platform Extensions (terraform fmt/validate + k6 + chaos JSON)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0

      - name: Terraform fmt check
        working-directory: infra/terraform-kind
        run: terraform fmt -check -recursive

      - name: Terraform init + validate
        working-directory: infra/terraform-kind
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: k6 script syntax check
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}/tools/k6:/scripts" grafana/k6 inspect /scripts/load.js

      - name: Chaos experiment JSON validity
        run: python -m json.tool tools/chaos/experiment.json > /dev/null

  notify:
    name: Status Summary
    needs: [build-test, ui, extensions]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summarize
        run: |
          echo "Build matrix: ${{ needs.build-test.result }}"
          echo "UI: ${{ needs.ui.result }}"
          echo "Extensions: ${{ needs.extensions.result }}"
          if [[ "${{ needs.build-test.result }}" != "success" || "${{ needs.ui.result }}" != "success" || "${{ needs.extensions.result }}" != "success" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi